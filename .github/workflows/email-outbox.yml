name: Process email outbox

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: Optional recipient for a production delivery test
        required: false
        type: string

permissions:
  id-token: write

concurrency:
  group: production-email-outbox
  cancel-in-progress: false

jobs:
  process-email-outbox:
    name: Process queued email
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the protected production worker
        env:
          CRON_ENDPOINT: https://www.galacticomnivore.com/api/cron/email-outbox
          OIDC_AUDIENCE: https://www.galacticomnivore.com/api/cron/email-outbox
          TEST_EMAIL_RECIPIENT: ${{ inputs.test_email || '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "::error::GitHub did not provide an OIDC token request context."
            exit 1
          fi

          OIDC_AUDIENCE_ENCODED="$(
            printf '%s' "$OIDC_AUDIENCE" | jq --slurp --raw-input --raw-output @uri
          )"
          GITHUB_OIDC_TOKEN="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --header "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE_ENCODED}" |
              jq --exit-status --raw-output '.value'
          )"

          CURL_ARGUMENTS=(
            --request POST \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 10 \
            --max-time 240 \
            --header "Authorization: Bearer $GITHUB_OIDC_TOKEN" \
            --header "Accept: application/json" \
            --header "User-Agent: github-actions-email-outbox/1.0"
          )
          if [[ -n "$TEST_EMAIL_RECIPIENT" ]]; then
            CURL_ARGUMENTS+=(
              --header "X-Email-Test-Recipient: $TEST_EMAIL_RECIPIENT"
            )
          fi

          curl "${CURL_ARGUMENTS[@]}" "$CRON_ENDPOINT"
